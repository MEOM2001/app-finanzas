{% extends 'base.html' %}
{% block content %}

<div class="container text-center my-4" style="max-width: 960px; margin: 0 auto;">
    <h1>Editar presupuesto: {{ presupuesto.nombre }}</h1>

    <form method="POST">

        <div class="text-start">
            {% csrf_token %}
            {{ form.as_p }}
        </div>

        <button class="btn btn-outline-success" type="submit">
            Guardar
        </button>
        <button class="btn btn-outline-secondary">
            <a class="nav-link" href="/presupuestos">Cancelar</a>
        </button>
    </form>
</div>

{% endblock %}
